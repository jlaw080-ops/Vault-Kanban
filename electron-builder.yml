appId: com.user.vaultkanban
productName: Vault Kanban
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,tsconfig.json,tsconfig.node.json}'
  - '!tests/**'
  - '!**/*.test.ts'
asarUnpack:
  - resources/**
mac:
  target: dmg
  category: public.app-category.productivity
  icon: build/icon.icns
  identity: null
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# releaseType 기본값이 draft 라, 넣지 않으면 태그 빌드마다 초안 릴리스가 생기고
# gh release edit --draft=false 로 직접 게시해야 했다 (2026-09-01 v0.2.0).
publish:
  provider: github
  releaseType: release
